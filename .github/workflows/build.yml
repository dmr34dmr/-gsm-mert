name: Build GSM Mert Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl libssl-dev libyaml-dev make wget curl unzip xz-utils lld clang

      - name: Setup Theos & Apple Toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          
          # Linux üzerinde iOS derlemesi yapabilmek için gerekli olan Procursus tabanlı toolchain'i çekiyoruz
          sudo mkdir -p /opt/theos/toolchain/linux
          cd /opt/theos/toolchain/linux
          curl -L -o iphone.tar.gz https://github.com/theos/provenance/releases/download/v1.0/linux-arm64.tar.gz || true
          if [ -f iphone.tar.gz ]; then tar -xzf iphone.tar.gz; fi
          
          # SDK Kurulumu
          sudo mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS14.5.sdk ./iPhoneOS14.5.sdk
          rm -rf master.zip sdks-master

      - name: Build Tweak (.deb)
        run: |
          cd $GITHUB_WORKSPACE
          export THEOS=/opt/theos
          # Theos make sisteminin doğru derleyici yollarını tanıması için PATH güncelleniyor
          export PATH="/opt/theos/toolchain/linux/iphone/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSMRelayOutgoing-deb
          path: packages/*.deb
