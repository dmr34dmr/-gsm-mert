name: Build GSM Mert Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl libssl-dev libyaml-dev make wget curl unzip xz-utils lld clang llvm gobjc

      - name: Setup Theos & SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          
          # Doğru dizinleri oluşturuyoruz
          sudo mkdir -p /opt/theos/toolchain/linux/iphone/bin
          
          # Apple Mach-O ve Objective-C derlemeleri için derleyiciyi symlinkliyoruz
          sudo ln -sf /usr/bin/clang /opt/theos/toolchain/linux/iphone/bin/clang
          sudo ln -sf /usr/bin/clang++ /opt/theos/toolchain/linux/iphone/bin/clang++
          sudo ln -sf /usr/bin/llvm-ar /opt/theos/toolchain/linux/iphone/bin/ar
          sudo ln -sf /usr/bin/llvm-strip /opt/theos/toolchain/linux/iphone/bin/strip
          
          # GNU ld yerine, Apple Darwin hedeflerini işleyebilen lld'yi kullanıyoruz
          sudo ln -sf /usr/bin/ld.lld /opt/theos/toolchain/linux/iphone/bin/ld

          # SDK Kurulumu
          sudo mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS14.5.sdk ./iPhoneOS14.5.sdk
          rm -rf master.zip sdks-master

      - name: Build Tweak (.deb)
        run: |
          cd $GITHUB_WORKSPACE
          export THEOS=/opt/theos
          export PATH="/opt/theos/toolchain/linux/iphone/bin:$PATH"
          # -Bdynamic ve diğer argümanların yönetimi için
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSMRelayOutgoing-deb
          path: packages/*.deb
