name: Build GSM Mert Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl libssl-dev libyaml-dev make wget curl unzip clang lld llvm xz-utils

      - name: Install Theos & Procursus Toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          
          # Apple platformları için gereken resmi procursus LLVM/Clang toolchain'ini indiriyoruz
          sudo mkdir -p /opt/theos/toolchain/linux/iphone
          cd /opt/theos/toolchain/linux/iphone
          curl -LO https://github.com/theos/provenance/releases/download/v1.0/linux-arm64.tar.gz || true
          
          # SDK Kurulumu
          mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip master.zip
          mv sdks-master/iPhoneOS14.5.sdk ./iPhoneOS14.5.sdk
          rm -rf master.zip sdks-master

      - name: Build Tweak (.deb)
        run: |
          cd $GITHUB_WORKSPACE
          export THEOS=/opt/theos
          # Linux toolchain'in derleme esnasında doğrudan clang kullanmasını sağlıyoruz
          export PATH="/opt/theos/toolchain/linux/iphone/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSMRelayOutgoing-deb
          path: packages/*.deb
