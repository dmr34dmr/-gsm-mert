name: Build GSM Mert Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl libssl-dev libyaml-dev make wget curl unzip xz-utils lld clang llvm

      - name: Setup Theos & Official Procursus Toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          
          # Apple Mach-O mimarisini ve komutlarını tanıyan resmi Procursus Linux toolchain'ini indiriyoruz
          sudo mkdir -p /opt/theos/toolchain/linux
          cd /opt/theos/toolchain/linux
          curl -LO https://github.com/procursusteam/llvm-project/releases/download/iphoneos-fix-2023/cctools-and-llvm-f16b2e1-linux-amd64.tar.xz || \
          curl -LO https://github.com/theos/provenance/releases/download/v1.0/linux-arm64.tar.xz || true
          
          # Eğer yukarıdaki paket inmezse veya format uymazsa alternatif sağlam toolchain scriptini çalıştırıyoruz
          if [ ! -f cctools-and-llvm-*.tar.xz ] && [ ! -f linux-arm64.tar.gz ]; then
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos-prs)" || true
          fi

          # SDK Kurulumu
          sudo mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS14.5.sdk ./iPhoneOS14.5.sdk
          rm -rf master.zip sdks-master

      - name: Build Tweak (.deb)
        run: |
          cd $GITHUB_WORKSPACE
          export THEOS=/opt/theos
          export PATH="/opt/theos/toolchain/linux/iphone/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSMRelayOutgoing-deb
          path: packages/*.deb
