name: Build GSM Mert Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        # .deb paketlemesi ve Theos imzalama işlemleri için dpkg ve ldid kuruyoruz
        run: brew install ldid dpkg

      - name: Setup Theos & SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git /Users/runner/theos
          
          # Doğrudan Theos SDK'lerini kuruyoruz (Toolchain indirmeye gerek yok, macOS zaten yerel destekliyor)
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/* /Users/runner/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Build Tweak (.deb)
        run: |
          cd $GITHUB_WORKSPACE
          export THEOS=/Users/runner/theos
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSMRelayOutgoing-deb
          path: packages/*.deb
